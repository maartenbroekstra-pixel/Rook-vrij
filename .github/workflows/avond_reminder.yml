name: 20u Rookvrij Reminder
on:
  schedule:
    # 17:55 UTC is 19:55 Nederlandse zomertijd (pas aan naar 18:55 in de wintertijd)
    - cron: '55 17 * * *'
  workflow_dispatch:

jobs:
  push_message:
    runs-on: ubuntu-latest
    steps:
      - name: Stuur 20u Bank-Trigger Melding
        run: |
          curl -H "Title: 🛋️ 20:00 Avond-anker" \
               -H "Priority: high" \
               -H "Tags: shield,no_smoking" \
               -d "Kinderen op bed? Je hoeft niet te roken! Morgen ben je blij als je het niet hebt gedaan!" \
               https://ntfy.sh/Rookvrij-alerts
